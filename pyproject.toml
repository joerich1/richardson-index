[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "richardson-index"
version = "1.0.0"
description = "Compare sports leagues that rarely play each other: league gaps with an honest range, the schedule as a circuit, and tiers inside each league."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-data"]
authors = [{ name = "Joseph Richardson" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]
keywords = ["sports-analytics", "college-football", "rating-systems", "network-analysis"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://josephrichardson.dev"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*encountered in matmul:RuntimeWarning"]
